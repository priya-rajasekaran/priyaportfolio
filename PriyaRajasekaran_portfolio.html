<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Padmapriya Rajasekaran — Biomedical Engineering Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:#F7F6F2;color:#1A1A1A;
  --acc:#0B7869;--accL:#E6F4F1;--accM:#7DCBBF;--bd:#E3E3E0;--mut:#6B6B6B;--ser:Lora,Georgia,serif}
.nav{display:flex;align-items:center;justify-content:space-between;padding:13px 24px;
  background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:8px}
.brand{font-family:var(--ser);font-size:15px;font-weight:600;letter-spacing:-.01em}
.acc{color:var(--acc)} .dim{color:#aaa;font-weight:400;font-size:12px}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{padding:5px 11px;border-radius:20px;font-size:11.5px;background:transparent;color:var(--mut);
  cursor:pointer;border:none;transition:all .2s;white-space:nowrap;font-family:inherit}
.tab.on{background:var(--acc);color:#fff}
.slide{max-width:860px;margin:0 auto;padding:44px 28px 60px}
.h1{font-family:var(--ser);font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-bottom:4px}
.h2{font-family:var(--ser);font-size:20px;font-weight:400;color:var(--acc);margin-top:4px;margin-bottom:22px}
.h3{font-family:var(--ser);font-size:16px;font-weight:600;margin-bottom:5px}
.tag{display:inline-block;padding:4px 11px;background:var(--accL);color:var(--acc);border-radius:20px;font-size:11px;font-weight:500;margin:3px}
.card{background:#fff;border-radius:14px;padding:20px 22px;border:1px solid var(--bd);margin-bottom:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
.met{text-align:center;padding:14px 8px;background:var(--accL);border-radius:10px;border:1px solid var(--accM)}
.met-n{font-family:var(--ser);font-size:26px;font-weight:600;color:var(--acc);line-height:1}
.met-l{font-size:10.5px;color:var(--mut);margin-top:5px;line-height:1.3}
.chip{display:inline-block;padding:3px 9px;background:#F2F2EE;color:#444;border-radius:9px;font-size:11px;margin:2px}
.lbl{font-size:10.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);margin-bottom:9px}
.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:10.5px;font-weight:500;white-space:nowrap}
.bg{background:#E6F4ED;color:#1A7A4A} .bb{background:#E6EEF8;color:#1A4A8A} .ba{background:#FEF3E2;color:#92550A}
.jbox{flex:1;background:#fff;border-radius:12px;padding:14px 16px;border:1px solid var(--bd);text-align:center;min-width:140px}
.hobby{display:flex;align-items:center;gap:6px;padding:6px 12px;background:#fff;border:1px solid var(--bd);border-radius:30px;font-size:12px;margin:3px}
.ph{background:#F2F2EE;border:2px dashed #D0D0CC;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--mut);font-size:11.5px;text-align:center;padding:16px}
.rline{font-size:12.5px;color:#3a3a3a;margin-bottom:4px;padding-left:13px;position:relative;line-height:1.5}
.rline::before{content:"·";position:absolute;left:3px;color:var(--acc)}
.qblock{border-left:3px solid var(--accM);padding:12px 16px;background:var(--accL);border-radius:0 10px 10px 0;margin:12px 0;font-style:italic;font-size:12.5px;color:#333;line-height:1.6}
.qattr{font-size:10.5px;color:var(--mut);font-style:normal;margin-top:6px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.frow{display:flex;align-items:stretch}
.fcol{flex:1;border:1px solid var(--bd);background:#fff;padding:10px}
.fcol:first-child{border-radius:8px 0 0 8px}
.fcol:last-child{border-right:1px solid var(--bd);border-radius:0 8px 8px 0}
.fcol+.fcol{border-left:none}
.fhd{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--acc);padding:5px 8px;border-radius:5px;margin-bottom:8px;text-align:center}
.fi{font-size:11px;color:#3a3a3a;padding:3px 0;border-bottom:1px solid #F0F0EE;line-height:1.4}
.fi:last-child{border-bottom:none}
.farr{display:flex;align-items:center;background:#F7F6F2;padding:0 5px;color:var(--accM);font-size:16px;flex-shrink:0}
.pimg{width:100%;border-radius:8px;margin-bottom:9px;border:1px solid var(--bd)}
.sk-row{font-size:12px;color:#3a3a3a;padding:5px 0;border-bottom:1px solid #F0F0EE;line-height:1.4}
.sk-row:last-child{border-bottom:none}
.act-card{padding:12px 14px;background:var(--accL);border-radius:10px;border:1px solid var(--accM)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media print{.nav,.tabs{display:none}.slide{padding:20px}body{background:#fff}}
@media(max-width:580px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .h1{font-size:26px}.h2{font-size:17px}
  .frow{flex-direction:column}
  .fcol{border-radius:0;border-left:1px solid var(--bd);border-top:none}
  .fcol:first-child{border-radius:8px 8px 0 0;border-top:1px solid var(--bd)}
  .fcol:last-child{border-radius:0 0 8px 8px}
  .farr{display:none}
}
</style>
</head>

function render() {

/* ── HELPERS ── */
function tags(arr){ return arr.map(function(t){ return '<span class="chip">'+t+'</span>'; }).join(''); }
function rows(arr){ return arr.map(function(s){ return '<div class="sk-row">'+s+'</div>'; }).join(''); }
function rl(arr){ return arr.map(function(s){ return '<div class="rline">'+s+'</div>'; }).join(''); }
function met(n,l){ return '<div class="met"><div class="met-n">'+n+'</div><div class="met-l">'+l+'</div></div>'; }
function fi(s){ return '<div class="fi">'+s+'</div>'; }
function fcol(title, items){
  return '<div class="fcol"><div class="fhd">'+title+'</div>'+items.map(fi).join('')+'</div>';
}
function farr(){ return '<div class="farr">&rarr;</div>'; }
function frow(cols){
  var parts = [];
  cols.forEach(function(c,i){
    parts.push(fcol(c[0],c[1]));
    if(i < cols.length-1) parts.push(farr());
  });
  return '<div class="frow">'+parts.join('')+'</div>';
}
function pimg(src, alt){ return '<img src="'+src+'" alt="'+alt+'" class="pimg">'; }
function projcard(title, sub, badge, badgeCls, imgSrc, imgAlt, desc, tagArr){
  return '<div class="card" style="margin-bottom:0">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:5px;margin-bottom:4px">'
    +'<div class="h3" style="font-size:14px;line-height:1.3">'+title+'</div>'
    +(badge ? '<span class="badge '+badgeCls+'" style="flex-shrink:0;font-size:10px">'+badge+'</span>' : '')
    +'</div>'
    +'<div style="font-size:11px;color:var(--mut);margin-bottom:8px">'+sub+'</div>'
    +(imgSrc ? pimg(imgSrc,imgAlt) : '')
    +'<p style="font-size:12px;color:#444;line-height:1.55;margin-bottom:9px">'+desc+'</p>'
    +'<div>'+tags(tagArr)+'</div>'
    +'</div>';
}
